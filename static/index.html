<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crescendo: rate every song</title>
  <meta name="description" content="Search any album, rate it song by song, and watch your taste profile build itself. Powered by MusicBrainz.">
  <meta name="theme-color" content="#121110">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://coverartarchive.org">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"></main>
  <footer class="footer">
    <div class="footer-inner">
      <span class="brand-mini"><svg class="logo-mark" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#F2EFE8"/><circle cx="13" cy="13" r="4.6" fill="#FF6A2B"/><circle cx="13" cy="13" r="1.3" fill="#121110"/></svg> Crescendo</span>
      <span>Music data from <a href="https://musicbrainz.org" target="_blank" rel="noopener">MusicBrainz</a> · Cover art from the <a href="https://coverartarchive.org" target="_blank" rel="noopener">Cover Art Archive</a></span>
    </div>
  </footer>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="tip" role="tooltip" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
